<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming & Security News</title>
    <style>
        /* Simple CSS - we'll style as we go */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { text-align: center; color: #00d4ff; }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .gaming { background: #00d4ff; color: #1a1a2e; }
        .security { background: #ff6b6b; color: #1a1a2e; }
        .search-btn { background: #4ecca3; color: #1a1a2e; }
        
        .results { margin-top: 20px; }
        .result {
            background: #16213e;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #00d4ff;
        }
        .result.security { border-left-color: #ff6b6b; }
        .result a {
            color: #00d4ff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .result a:hover { text-decoration: underline; }
        .meta { color: #888; font-size: 14px; margin-top: 5px; }
        .loading { text-align: center; color: #888; }
    </style>
</head>
<body>
    <h1>🎮 Gaming & 🔒 Security News</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search any topic...">
        <button class="search-btn" onclick="doSearch()">Search</button>
    </div>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="gaming" onclick="quickSearch('gaming')" style="flex: 1;">🎮 Gaming</button>
        <button class="security" onclick="quickSearch('cybersecurity')" style="flex: 1;">🔒 Security</button>
    </div>
    
    <div id="results" class="results"></div>
    
    <script>
        // Your Exa API Key (get one at https://dashboard.exa.ai/api-keys)
        // ⚠️ Replace with your actual API key!
        const EXA_API_KEY = '65d9409f-130f-42e9-a4ed-d2bd2bd084f4';
        
        function quickSearch(topic) {
            document.getElementById('searchInput').value = topic;
            doSearch();
        }
        
        async function doSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            
            document.getElementById('results').innerHTML = '<div class="loading">🔍 Searching...</div>';
            
            try {
                const response = await fetch('https://api.exa.ai/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': EXA_API_KEY
                    },
                    body: JSON.stringify({
                        query: query,
                        numResults: 5,
                        type: 'fast',
                        contents: {
                            text: { maxCharacters: 500 }
                        }
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // Display results
                const resultsHtml = data.results.map(result => `
                    <div class="result ${isSecurityQuery(query) ? 'security' : ''}">
                        <a href="${result.url}" target="_blank">${result.title}</a>
                        <div class="meta">${result.published_date || 'No date'} • ${result.url}</div>
                        <p>${result.text ? result.text.substring(0, 150) + '...' : ''}</p>
                    </div>
                `).join('');
                
                document.getElementById('results').innerHTML = resultsHtml || '<div class="result">No results found</div>';
                
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="result">
                        <a href="#">❌ Error</a>
                        <div class="meta">${error.message}</div>
                        <p>Make sure your Exa API key is set!</p>
                    </div>
                `;
            }
        }
        
        function isSecurityQuery(query) {
            const securityTerms = ['security', 'cybersecurity', 'hack', 'vulnerability', 'infosec', 'cyber'];
            return securityTerms.some(term => query.toLowerCase().includes(term));
        }
        
        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>

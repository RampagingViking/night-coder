<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DK Island Swing METAL - Recorder</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d0000 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Arial Black', sans-serif;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 1.8em; text-shadow: 0 0 20px #ff0000; margin-bottom: 10px; }
        p { color: #888; margin-bottom: 30px; }
        button {
            background: linear-gradient(180deg, #ff4444 0%, #cc0000 100%);
            border: 4px solid #ffaa00;
            color: white;
            font-size: 1.5em;
            padding: 15px 40px;
            cursor: pointer;
            border-radius: 10px;
            margin: 10px;
        }
        #status { margin-top: 20px; font-size: 1.2em; color: #ff6600; }
        #downloadBtn {
            background: linear-gradient(180deg, #44ff44 0%, #00cc00 100%);
            border: 4px solid #00ff00;
            display: none;
        }
    </style>
</head>
<body>
    <h1>🦘 DK ISLAND SWING 🦘<br>HEAVY METAL</h1>
    <p>Record and download as audio file!</p>
    
    <button id="recordBtn" onclick="startRecording()">🎙️ RECORD</button>
    <button id="stopBtn" onclick="stopRecording()" style="display:none;">🛑 STOP</button>
    <br>
    <button id="downloadBtn" onclick="downloadAudio()">⬇️ DOWNLOAD AUDIO</button>
    
    <div id="status"></div>

    <script>
        let audioCtx, dest, mediaRecorder, chunks = [];
        
        async function startRecording() {
            document.getElementById('recordBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('status').innerText = 'Recording... Playing metal! 🎸🤘';
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
            
            // Start playing
            playHeavyMetalDK(dest);
            
            // Start recording
            mediaRecorder = new MediaRecorder(dest.stream);
            chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                window.audioBlob = blob;
            };
            mediaRecorder.start();
        }
        
        function stopRecording() {
            mediaRecorder.stop();
            document.getElementById('recordBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'inline-block';
            document.getElementById('status').innerText = 'Recording complete! Click download.';
        }
        
        function downloadAudio() {
            const url = URL.createObjectURL(window.audioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'DK-Island-Swing-METAL.webm';
            a.click();
            document.getElementById('status').innerText = 'Download started! Open on your phone.';
        }
        
        function createDistortedGuitar(freq, duration, time, gainNode, distortion = 5) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const distortionNode = audioCtx.createWaveShaper();
            const curve = new Float32Array(44100);
            for (let i = 0; i < 44100; i++) {
                const x = (i / 44100) * 2 - 1;
                curve[i] = Math.tanh(distortion * x);
            }
            distortionNode.curve = curve;
            osc.type = 'sawtooth';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.3, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + duration - 0.05);
            osc.connect(distortionNode);
            distortionNode.connect(gain);
            gain.connect(gainNode);
            osc.start(time);
            osc.stop(time + duration);
        }
        
        function createBass(freq, duration, time, gainNode) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.4, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + duration - 0.02);
            osc.connect(gain);
            gain.connect(gainNode);
            osc.start(time);
            osc.stop(time + duration);
        }
        
        function createDrum(time, type, gainNode) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            if (type === 'kick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(30, time + 0.1);
                gain.gain.setValueAtTime(1, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
            } else if (type === 'snare') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, time);
                gain.gain.setValueAtTime(0.5, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            } else {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, time);
                gain.gain.setValueAtTime(0.1, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
            }
            osc.connect(gain);
            gain.connect(gainNode);
            osc.start(time);
            osc.stop(time + 0.3);
        }
        
        function playHeavyMetalDK(destNode) {
            const startTime = audioCtx.currentTime;
            const bpm = 180;
            const beatDur = 60 / bpm;
            const melody = [
                { note: 'A3', dur: beatDur * 0.5 }, { note: 'E4', dur: beatDur * 0.5 },
                { note: 'C4', dur: beatDur * 0.5 }, { note: 'E4', dur: beatDur * 0.5 },
                { note: 'A4', dur: beatDur * 0.5 }, { note: 'G4', dur: beatDur * 0.5 },
                { note: 'E4', dur: beatDur * 0.5 }, { note: 'C4', dur: beatDur * 0.5 },
            ];
            for (let repeat = 0; repeat < 4; repeat++) {
                for (let i = 0; i < melody.length; i++) {
                    const freq = noteToFreq(melody[i].note);
                    createDistortedGuitar(freq, melody[i].dur * 0.8, startTime + (repeat * 8 + i) * beatDur * 0.5, destNode, 8);
                }
            }
            const bassLine = ['A2', 'A2', 'E2', 'E2', 'A2', 'G2', 'E2', 'E2'];
            for (let repeat = 0; repeat < 4; repeat++) {
                for (let i = 0; i < bassLine.length; i++) {
                    createBass(noteToFreq(bassLine[i]), beatDur * 0.5, startTime + (repeat * 8 + i) * beatDur * 0.5, destNode);
                }
            }
            for (let i = 0; i < 64; i++) {
                const drumTime = startTime + i * beatDur * 0.25;
                if (i % 4 === 0) createDrum(drumTime, 'kick', destNode);
                if (i % 4 === 2) createDrum(drumTime, 'snare', destNode);
                createDrum(drumTime + beatDur * 0.125, 'hihat', destNode);
            }
            const soloNotes = ['A5', 'E5', 'A5', 'E5', 'A5', 'G5', 'E5', 'G5', 'A5', 'E5', 'A5', 'E5', 'A5', 'G5', 'E5', 'C5'];
            for (let i = 0; i < soloNotes.length; i++) {
                const soloTime = startTime + 16 * beatDur * 0.5 + i * beatDur * 0.25;
                createDistortedGuitar(noteToFreq(soloNotes[i]), beatDur * 0.2, soloTime, destNode, 15);
            }
        }
        
        function noteToFreq(note) {
            const notes = { 'C': 261.63, 'D': 293.66, 'E': 329.63, 'F': 349.23, 'G': 392.00, 'A': 440.00, 'B': 493.88 };
            return notes[note.slice(0, -1)] * Math.pow(2, parseInt(note.slice(-1)) - 4);
        }
    </script>
</body>
</html>
